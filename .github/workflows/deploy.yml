name: Deploy reports

on:
    workflow_dispatch:
    push:
        branches: [main]

# A newer deploy replaces an older one, which is safe because it contains everything.
concurrency:
    group: pages
    cancel-in-progress: true

permissions:
    contents: read
    pages: write
    id-token: write

# Upload and deploy are separate jobs. Deploying in the same job as the upload sometimes found no
# artifact yet, and re-running that one job uploaded a second copy, which deploy-pages refuses.
# Now a re-run of a failed deploy reuses the one artifact the upload job made.
jobs:
    upload:
        runs-on: ubuntu-latest
        timeout-minutes: 15
        steps:
            - uses: actions/checkout@v7
            - uses: actions/configure-pages@v6
            - uses: actions/upload-pages-artifact@v5
              with:
                  path: site

    deploy:
        needs: upload
        runs-on: ubuntu-latest
        timeout-minutes: 15
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        steps:
            - id: deployment
              uses: actions/deploy-pages@v5
